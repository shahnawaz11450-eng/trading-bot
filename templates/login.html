<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL-FATH Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#090d13;color:#c8d8e8;font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#0d1520;border:1px solid #1a2d45;border-radius:12px;padding:40px;width:340px;}
.top{border-top:2px solid #d4a843;border-radius:12px 12px 0 0;margin:-40px -40px 30px;padding:0;}
h1{text-align:center;color:#d4a843;font-size:24px;letter-spacing:4px;margin-bottom:6px;}
.sub{text-align:center;color:#4a6070;font-size:10px;letter-spacing:2px;margin-bottom:28px;}
label{display:block;color:#4a6070;font-size:11px;letter-spacing:2px;margin-bottom:6px;}
input{width:100%;background:#090d13;border:1px solid #1a2d45;border-radius:6px;padding:12px;color:#c8d8e8;font-family:monospace;font-size:13px;outline:none;margin-bottom:16px;}
input:focus{border-color:#00e5ff;}
button{width:100%;background:#d4a843;border:none;border-radius:6px;padding:13px;color:#090d13;font-family:monospace;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:4px;}
.err{background:rgba(255,23,68,0.1);border:1px solid #ff1744;border-radius:5px;padding:10px;color:#ff1744;font-size:11px;margin-bottom:16px;}
.hint{margin-top:20px;padding:12px;background:rgba(0,229,255,0.04);border:1px solid #1a2d45;border-radius:5px;font-size:10px;color:#4a6070;line-height:2;}
</style>
</head>
<body>
<div class="box">
<div style="text-align:center;margin-bottom:24px;">
<div style="width:56px;height:56px;border:2px solid #d4a843;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:#d4a843;margin-bottom:12px;">AF</div>
<h1>AL-FATH</h1>
<div class="sub">INSTITUTIONAL TRADING PLATFORM</div>
</div>
{% if error %}<div class="err">⚠ {{ error }}</div>{% endif %}
<form method="POST">
<label>USERNAME</label>
<input type="text" name="username" placeholder="Enter username" required>
<label>PASSWORD</label>
<input type="password" name="password" placeholder="Enter password" required>
<button type="submit">LOGIN →</button>
</form>
<div class="hint">
DEMO ACCOUNTS:<br>
admin / admin123 → Admin Panel<br>
farrukh123 / Freel123 → User Panel
</div>
</div>
</body>
</html>
